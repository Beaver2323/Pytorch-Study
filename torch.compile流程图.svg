flowchart TD
    Start["开始: 调用 torch.compile(model)"]
    
    Start --> Step1["步骤1: 图捕获 (Graph Capture)"]
    
    Step1 --> Choice1{"选择捕获模式?"}
    
    Choice1 -->|"默认"| Dynamo["Dynamo: 动态图捕获<br/>(将Python代码转为FX图)"]
    Choice1 -->|"TorchDynamo替代"| Lazy["LazyTensorCore (LTC)<br/>(延迟执行捕获)"]
    Choice1 -->|"TorchScript"| Script["TorchScript<br/>(静态图追踪)"]
    
    Dynamo --> FX["输出: FX Graph (中间表示)"]
    Lazy --> FX
    Script --> FX
    
    FX --> Step2["步骤2: 图优化 (Graph Optimization)"]
    
    Step2 --> PreGrad["Pre-Grad Pass<br/>(梯度计算前优化)"]
    PreGrad --> JointGraph["生成联合前向-反向图"]
    JointGraph --> PostGrad["Post-Grad Pass<br/>(梯度计算后优化)"]
    
    PostGrad --> Choice2{"选择优化后端?"}
    
    %% 通用后端
    Choice2 -->|"通用"| Inductor["Inductor (TorchInductor)"]
    Choice2 -->|"其他"| OtherBackend["其他AOT后端<br/>(如: aot_eager, eager等)"]
    
    %% Inductor内部路径 - 硬件维度
    Inductor --> Choice3{"目标硬件?"}
    
    Choice3 -->|"GPU (CUDA)"| GPUPath["GPU 路径"]
    Choice3 -->|"CPU"| CPUPath["CPU 路径"]
    Choice3 -->|"昇腾NPU"| NPUPath["NPU 路径"]
    
    %% GPU 路径
    GPUPath --> ChoiceGPU{"GPU代码生成引擎?"}
    ChoiceGPU -->|"Triton"| Triton["Triton 代码生成<br/>(默认)"]
    ChoiceGPU -->|"CUTLASS"| CUTLASS["CUTLASS 代码生成"]
    ChoiceGPU -->|"CUDA C++"| CudaCpp["CUDA C++ 代码生成"]
    
    Triton --> AutotuneGPU["GPU Autotune<br/>(可选 MAX_AUTOTUNE)"]
    CUTLASS --> AutotuneGPU
    CudaCpp --> AutotuneGPU
    
    AutotuneGPU --> KernelGPU["生成GPU Kernel"]
    
    %% CPU 路径
    CPUPath --> ChoiceCPU{"CPU代码生成引擎?"}
    ChoiceCPU -->|"C++ OpenMP"| CppOpenMP["C++ OpenMP 生成<br/>(默认)"]
    ChoiceCPU -->|"Intel OneDNN"| OneDNN["Intel OneDNN 生成"]
    ChoiceCPU -->|"LLVM"| LLVM_CPU["LLVM JIT 生成"]
    
    CppOpenMP --> AutotuneCPU["CPU Autotune<br/>(较保守)"]
    OneDNN --> AutotuneCPU
    LLVM_CPU --> AutotuneCPU
    
    AutotuneCPU --> KernelCPU["生成CPU Kernel"]
    
    %% NPU 路径
    NPUPath --> ChoiceNPU{"NPU后端选择?"}
    ChoiceNPU -->|"Inductor后端"| NPU_Inductor["Inductor 后端"]
    ChoiceNPU -->|"NPUGraphs后端"| NPU_Graphs["NPUGraphs 后端"]
    ChoiceNPU -->|"NPUGraph_EX"| NPU_EX["NPUGraph_EX 后端"]
    ChoiceNPU -->|"AOT模式"| NPU_AOT["AOT (Ahead-of-Time)"]
    
    NPU_Inductor --> ChoiceNPU_Engine{"Inductor代码生成引擎?"}
    ChoiceNPU_Engine -->|"DVM"| DVM["DVM (默认)"]
    ChoiceNPU_Engine -->|"Triton"| NPU_Triton["Triton 生成"]
    ChoiceNPU_Engine -->|"MLIR"| NPU_MLIR["MLIR 生成"]
    
    DVM --> ChoiceDVMMode{"DVM融合模式?"}
    ChoiceDVMMode -->|"mlir_fusion"| MLIRFusion["mlir_fusion<br/>(复用MLIR融合分析)"]
    ChoiceDVMMode -->|"graph_fusion"| GraphFusion["graph_fusion<br/>(独立图融合)"]
    
    MLIRFusion --> DVMBytecode["生成DVM字节码"]
    GraphFusion --> DVMBytecode
    NPU_Triton --> TritonNPU["生成NPU Triton Kernel"]
    NPU_MLIR --> MLIRNPU["生成NPU MLIR 机器码"]
    
    DVMBytecode --> NPUVirtual["NPU虚拟机解释执行"]
    TritonNPU --> NPUKernel["NPU直接执行Kernel"]
    MLIRNPU --> NPUKernel
    NPU_Graphs --> Capture["捕获NPU操作序列"]
    NPU_EX --> CaptureEX["捕获+FX优化+缓存"]
    NPU_AOT --> AOTCompile["离线编译为二进制"]
    
    Capture --> Replay["后续执行: 直接重放"]
    CaptureEX --> Replay
    
    %% 汇总
    KernelGPU --> Execute["执行: 在目标硬件上运行"]
    KernelCPU --> Execute
    NPUVirtual --> Execute
    NPUKernel --> Execute
    Replay --> Execute
    OtherBackend --> Execute
    
    Execute --> End["结束"]
